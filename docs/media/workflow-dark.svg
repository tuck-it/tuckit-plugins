<svg xmlns="http://www.w3.org/2000/svg" width="880" height="880" viewBox="0 0 880 880" role="img" aria-labelledby="title">
  <title id="title">How one feature gets built with tuckit</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#6b7685" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6ebf0" text-anchor="middle">
    <!-- Lane headings. -->
    <rect x="32" y="20" width="200" height="34" rx="9" fill="#10302e" stroke="#4fa8a1" stroke-width="1.5"/>
    <g font-size="15" font-weight="600">
      <text x="132" y="42">You</text>
      <text x="456" y="42">Your agent</text>
      <text x="764" y="42">Teammate</text>
    </g>

    <!-- Each arrow joins consecutive steps in the space between rows. -->
    <g fill="none" stroke="#6b7685" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M132 116 V124 H456 V132"/>
      <path d="M456 186 V194 H132 V202"/>
      <path d="M132 242 V250 H456 V258"/>
      <path d="M456 312 V320 H132 V328"/>
      <path d="M132 368 V376 H456 V384"/>
      <path d="M456 438 V454"/>
      <path d="M456 508 V524"/>
      <path d="M456 578 V594"/>
      <path d="M456 634 V642 H764 V650"/>
      <path d="M764 690 V698 H456 V706"/>
    </g>

    <!-- The feature moves from the request to shipment, top to bottom. -->
    <g fill="#161c23" stroke="#3a4552" stroke-width="1.5">
      <rect x="32" y="76" width="200" height="40" rx="9"/>
      <rect x="264" y="132" width="384" height="54" rx="9"/>
      <rect x="32" y="202" width="200" height="40" rx="9"/>
      <rect x="264" y="258" width="384" height="54" rx="9"/>
      <rect x="264" y="384" width="384" height="54" rx="9"/>
      <rect x="264" y="454" width="384" height="54" rx="9"/>
      <rect x="264" y="524" width="384" height="54" rx="9"/>
      <rect x="264" y="594" width="384" height="40" rx="9"/>
      <rect x="680" y="650" width="168" height="40" rx="9"/>
      <rect x="264" y="706" width="384" height="40" rx="9"/>
    </g>
    <rect x="32" y="328" width="200" height="40" rx="9" fill="#10302e" stroke="#4fa8a1" stroke-width="1.5"/>
    <text x="132" y="101">Add login.</text>
    <text x="456" y="154"><tspan x="456">Asks what's in scope and</tspan><tspan x="456" dy="20">what counts as working</tspan></text>
    <text x="132" y="227">Answers</text>
    <text x="456" y="280"><tspan x="456">Shows the promise: what it will build,</tspan><tspan x="456" dy="20">and how you'll know it's done</tspan></text>
    <text x="132" y="353" font-weight="600">Approve</text>
    <text x="456" y="406"><tspan x="456">Posts its plan, then builds</tspan><tspan x="456" dy="20">on a branch</tspan></text>
    <text x="456" y="476"><tspan x="456">Gets a second agent</tspan><tspan x="456" dy="20">to review it</tspan></text>
    <text x="456" y="546"><tspan x="456">Checks the promise and</tspan><tspan x="456" dy="20">writes down what it saw</tspan></text>
    <text x="456" y="619">Opens a pull request</text>
    <text x="764" y="675">Reviews and merges</text>
    <text x="456" y="731">Marks it shipped on the board</text>

    <!-- Shared record and decision legend. -->
    <rect x="32" y="770" width="816" height="62" rx="9" fill="#161c23" stroke="#3a4552" stroke-width="1.5"/>
    <text x="440" y="793" font-weight="600">The board</text>
    <text x="440" y="815">Every decision, the promise, and what was checked are written here, not lost in chat.</text>
    <rect x="32" y="850" width="24" height="18" rx="9" fill="#10302e" stroke="#4fa8a1" stroke-width="1.5"/>
    <text x="66" y="864" text-anchor="start">= you decide</text>
  </g>
</svg>
