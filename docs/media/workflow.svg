<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">How one feature gets built with tuckit</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1 L6 4 L2 7" fill="none" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Five scenes, with one highlighted decision. -->
    <g fill="#f4f6f9" stroke="#d8dde5" stroke-width="1.5">
      <rect x="8" y="74" width="176" height="208" rx="14"/>
      <rect x="200" y="74" width="176" height="208" rx="14"/>
      <rect x="584" y="74" width="176" height="208" rx="14"/>
      <rect x="776" y="74" width="176" height="208" rx="14"/>
    </g>
    <rect x="392" y="74" width="176" height="208" rx="14" fill="#e3efee" stroke="#1f625e" stroke-width="2"/>
    <rect x="439" y="34" width="82" height="26" rx="13" fill="#e3efee" stroke="#1f625e" stroke-width="1.5"/>
    <text x="480" y="51" fill="#1f625e" font-size="13" font-weight="600">your call</text>

    <!-- Quiet arrows keep the reading direction clear. -->
    <g fill="none" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M188 178 H196"/>
      <path d="M380 178 H388"/>
      <path d="M572 178 H580"/>
      <path d="M764 178 H772"/>
    </g>

    <!-- You, with a speech bubble. -->
    <g transform="translate(64 112)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g fill="#e3efee" stroke="#1f625e">
        <circle cx="19" cy="27" r="9"/>
        <path d="M4 60 V54 C4 45 10 41 19 41 C28 41 34 45 34 54 V60 Z"/>
      </g>
      <path d="M37 3 H56 A7 7 0 0 1 63 10 V21 A7 7 0 0 1 56 28 H43 L35 35 V28 A7 7 0 0 1 30 21 V10 A7 7 0 0 1 37 3 Z" fill="#f4f6f9" stroke="#3b4654"/>
      <path d="M39 12 H54 M39 19 H49" fill="none" stroke="#3b4654"/>
    </g>

    <!-- A curious, friendly robot. The question mark is drawn, too. -->
    <g transform="translate(256 112)" fill="none" stroke="#3b4654" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 18 V12 M6 32 H2 V44 H6 M42 33 H46 V44 H42"/>
      <circle cx="22" cy="9" r="3" fill="#f4f6f9"/>
      <rect x="6" y="18" width="36" height="33" rx="10" fill="#f4f6f9"/>
      <path d="M15 31 V34 M32 31 V34 M17 41 Q23 46 29 41 M14 60 V56 H34 V60"/>
      <path d="M49 9 C49 1 61 1 61 9 C61 14 55 14 55 19"/>
      <circle cx="55" cy="25" r="1" fill="#3b4654" stroke="none"/>
    </g>

    <!-- The only approval: a generous, unmistakable check. -->
    <g transform="translate(448 112)" fill="none" stroke="#1f625e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="28" fill="#e3efee"/>
      <path d="M18 32 L28 42 L47 22"/>
    </g>

    <!-- The same robot, now building and inspecting. -->
    <g transform="translate(640 112)" fill="none" stroke="#3b4654" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 18 V12 M6 32 H2 V44 H6 M42 33 H46 M14 60 V56 H34 V60"/>
      <circle cx="22" cy="9" r="3" fill="#f4f6f9"/>
      <rect x="6" y="18" width="36" height="33" rx="10" fill="#f4f6f9"/>
      <path d="M15 31 V34 M32 31 V34 M17 41 Q23 46 29 41"/>
      <path d="M50 5 L55 0 L63 8 L58 13 L55 10 L46 19 L42 15 L51 6 Z" fill="#f4f6f9"/>
      <circle cx="52" cy="45" r="8" fill="#f4f6f9"/>
      <path d="M58 51 L64 57"/>
    </g>

    <!-- Two branches join beside the teammate who merges them. -->
    <g transform="translate(832 112)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g fill="none" stroke="#3b4654">
        <path d="M9 48 V14 M28 48 V41 C28 28 9 35 9 21 M4 19 L9 14 L14 19"/>
        <circle cx="9" cy="53" r="4" fill="#f4f6f9"/>
        <circle cx="28" cy="53" r="4" fill="#f4f6f9"/>
      </g>
      <g fill="#e3efee" stroke="#1f625e">
        <circle cx="49" cy="25" r="9"/>
        <path d="M36 60 V53 C36 45 41 41 49 41 C57 41 62 45 62 53 V60 Z"/>
      </g>
    </g>

    <g fill="#1d2733" font-size="17" font-weight="600">
      <text x="96" y="211">You ask</text>
      <text x="288" y="211">It asks back</text>
      <text x="480" y="211">You approve once</text>
      <text x="672" y="211">It builds and checks</text>
      <text x="864" y="211">A teammate merges</text>
    </g>
    <g fill="#5b6573" font-size="13">
      <text x="96" y="239">&quot;Add login.&quot;</text>
      <text x="288" y="239"><tspan x="288">Only what changes</tspan><tspan x="288" dy="18">the result</tspan></text>
      <text x="480" y="239"><tspan x="480">What it builds, and how</tspan><tspan x="480" dy="18">you'll know it's done</tspan></text>
      <text x="672" y="239"><tspan x="672">Plans, builds, gets</tspan><tspan x="672" dy="18">a review, tests</tspan></text>
      <text x="864" y="239">Shipped</text>
    </g>

    <!-- The shared board records questions, approval, and the work. -->
    <g fill="none" stroke="#9aa3b0" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round">
      <path d="M288 283 V332"/>
      <path d="M480 283 V332"/>
      <path d="M672 283 V332"/>
    </g>
    <rect x="48" y="332" width="864" height="62" rx="14" fill="#f4f6f9" stroke="#d8dde5" stroke-width="1.5"/>
    <g transform="translate(71 348)" fill="none" stroke="#3b4654" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="34" height="30" rx="5"/>
      <path d="M1 8 H33 M12 9 V29 M23 9 V29 M5 14 H8 M16 14 H19 M16 20 H19 M27 14 H30"/>
    </g>
    <text x="125" y="368" text-anchor="start" fill="#5b6573" font-size="15">The board keeps every decision, the promise, and what was checked.</text>
  </g>
</svg>
